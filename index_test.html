<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DP GLB Multi Viewer Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.58);
      padding: 12px;
      border-radius: 10px;
      min-width: 320px;
      backdrop-filter: blur(4px);
    }

    #panel h1 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 700;
    }

    #panel .row {
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.45;
    }

    #buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: white;
      background: #3a3a3a;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .btn-original { background: #505050; }
    .btn-gray     { background: #7a7a7a; }
    .btn-yellow   { background: #d4aa00; color: #111; }
    .btn-blue     { background: #2563eb; }
    .btn-red      { background: #dc2626; }

    #status {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
      white-space: pre-line;
    }

    canvas {
      display: block;
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="panel">
      <h1>DP Design Pilot / GLB PoC</h1>

      <div class="row">Orbit: ляв бутон | Pan: десен бутон | Zoom: колелце</div>
      <div class="row">Тест: 3 отделни GLB файла в една обща сцена</div>

      <div id="buttons">
        <button class="btn-original" id="btnOriginal">Original</button>
        <button class="btn-gray" id="btnGray">Gray</button>
        <button class="btn-yellow" id="btnYellow">Yellow</button>
        <button class="btn-blue" id="btnBlue">Blue</button>
        <button class="btn-red" id="btnRed">Red</button>
      </div>

      <div id="status">Зареждане...</div>
    </div>
  </div>

  <script type="module" src="./main_test.js"></script>
</body>
</html>
