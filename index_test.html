<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DP GLB Multi Viewer Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: calc(100vw - 20px);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: white;
      background: #3a3a3a;
      min-height: 38px;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .btn-original { background: #505050; }
    .btn-gray     { background: #7a7a7a; }
    .btn-yellow   { background: #d4aa00; color: #111; }
    .btn-blue     { background: #2563eb; }
    .btn-red      { background: #dc2626; }

    .btn-hide     { background: #7c3aed; }
    .btn-show     { background: #059669; }

    canvas {
      display: block;
    }

    @media (max-width: 768px) {
      #panel {
        top: 8px;
        left: 8px;
        right: 8px;
        max-width: none;
        padding: 8px;
        gap: 6px;
      }

      .button-row {
        gap: 6px;
      }

      button {
        font-size: 12px;
        padding: 8px 10px;
        min-height: 36px;
      }
    }
  </style>

  <script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="panel">
      <div class="button-row">
        <button class="btn-original" id="btnOriginal">Original</button>
        <button class="btn-gray" id="btnGray">Gray</button>
        <button class="btn-yellow" id="btnYellow">Yellow</button>
        <button class="btn-blue" id="btnBlue">Blue</button>
        <button class="btn-red" id="btnRed">Red</button>
      </div>

      <div class="button-row">
        <button class="btn-hide" id="btnHideSteelRollers">Hide rollers</button>
        <button class="btn-show" id="btnShowSteelRollers">Show rollers</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main_test.js?v=3"></script>
</body>
</html>
